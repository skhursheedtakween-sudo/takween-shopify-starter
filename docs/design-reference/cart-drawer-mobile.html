<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Takween Starter — Cart drawer mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#16181B}a:hover{color:#3B3F45}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #16181B; display: flex; flex-direction: column">
<div style="padding: 12px 8px 12px 20px; border-bottom: 1px solid #E3E1DC; display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">Your cart (2)</h2>
<button aria-label="Close cart" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="padding: 14px 20px; background: #F6F5F2; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; font-weight: 600">You’re <strong>£5.00</strong> away from free delivery</p>
<div role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="45" aria-label="Progress to free delivery" style="height: 6px; border-radius: 3px; background: #E3E1DC"><div style="width: 90%; height: 6px; border-radius: 3px; background: #1F7A4D"></div></div>
</div>
<div style="flex: 1; overflow: hidden; padding: 4px 20px">
<div style="display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid #E3E1DC">
<div style="width: 76px; height: 92px; border-radius: 8px; background: #D9DDE3; flex: none"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<a href="#" style="font-size: 15px; font-weight: 700; text-decoration: none">Sample Relaxed Overshirt</a>
<span style="font-size: 13px; color: #5A5F66">Charcoal / M</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
<div style="display: flex; align-items: center; border: 1.5px solid #C9C6BF; border-radius: 8px"><button aria-label="Decrease quantity" style="width: 40px; height: 40px; border: 0; background: none; font-size: 18px">−</button><span style="width: 28px; text-align: center; font-weight: 700">1</span><button aria-label="Increase quantity" style="width: 40px; height: 40px; border: 0; background: none; font-size: 18px">+</button></div>
<span style="font-weight: 800; color: #B42318">£45.00</span>
</div>
<a href="#" aria-label="Remove Sample Relaxed Overshirt" style="font-size: 13px; color: #4A4F56">Remove</a>
</div>
</div>
<div style="display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid #E3E1DC; opacity: 0.55" aria-busy="true">
<div style="width: 76px; height: 92px; border-radius: 8px; background: #E7E2D9; flex: none"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 700">Sample Organic Cotton Tee</span>
<span style="font-size: 13px; color: #5A5F66">Stone / L</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
<div style="display: flex; align-items: center; border: 1.5px solid #C9C6BF; border-radius: 8px"><span style="width: 40px; height: 40px"></span><span style="width: 28px; text-align: center; font-weight: 700">2</span><span style="width: 40px; height: 40px"></span></div>
<span style="font-weight: 800">£48.00</span>
</div>
<span style="font-size: 12px; font-weight: 600; color: #4A4F56">Updating…</span>
</div>
</div>
<p role="status" style="margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: #E8F3EC; color: #1F5F3D; font-size: 13px; font-weight: 600">Quantity updated</p>
</div>
<div style="padding: 16px 20px 28px; border-top: 1px solid #E3E1DC; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 20px rgba(22,24,27,0.06)">
<div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 800"><span>Subtotal</span><span>£93.00</span></div>
<p style="margin: 0; font-size: 12px; color: #5A5F66">Taxes and shipping calculated at checkout.</p>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 54px; background: #16181B; color: #FFFFFF; border-radius: 8px; font-weight: 800; font-size: 16px; text-decoration: none">Checkout</a>
<a href="#" style="text-align: center; font-size: 14px; font-weight: 700; padding: 6px">Continue shopping</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
